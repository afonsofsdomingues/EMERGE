[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emerge"
version = "3.0.0"
description = "Benchmark for replicating emergent-misalignment results on one shared checkpoint bank"
requires-python = ">=3.11"
dependencies = [
    "transformers>=5.0",
    "peft>=0.14",
    "accelerate>=1.0",
    "safetensors",
    "huggingface-hub",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml",
    "numpy",
    "pandas",
    "matplotlib",
    "langdetect>=1.0.9",
]

# torch build selection.  `uv sync --extra gpu` = CUDA wheels from PyPI;
# `uv sync --extra cpu` = the pytorch.org CPU index (CI and laptop test runs).
# NOTE: accelerate pulls torch transitively, so a bare `uv sync`/`uv run`
# (no extra) also resolves the CUDA build -- on a CPU box, always pass
# `--extra cpu` or the ~5 GB CUDA torch replaces the CPU one.
[project.optional-dependencies]
cpu = ["torch>=2.4"]
gpu = ["torch>=2.4"]
openai = ["openai"]              # the OpenAI judge backend
anthropic = ["anthropic"]        # the anthropic_judge plugin backend
wandb = ["wandb"]                # logging.use_wandb=true
bnb = ["bitsandbytes"]           # optim=lion_*/8-bit optimizers, model.load_in_4bit
slurm = ["hydra-submitit-launcher"]
vllm = ["vllm>=0.30"]                  # vLLM generation backend (pins its own torch; CUDA only)

[project.scripts]
emerge = "emerge.cli.main:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# vllm ships Linux/CUDA-only wheels; without this uv resolves an ancient vllm
# that "supports" every platform.
environments = ["sys_platform == 'linux'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }], [{ extra = "cpu" }, { extra = "vllm" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["emerge*", "plugins*", "hydra_plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: end-to-end tests that load a model"]

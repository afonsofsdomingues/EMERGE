    framing: assistant_history
    shots: 8
    n_per_question: 25
    max_new_tokens: 600
    temperature: 1.0
    sample: null
    match_length: false
  - name: icl_tool_output
    kind: icl
    path: data/eval/free_form/8_questions_betley_et_al.jsonl

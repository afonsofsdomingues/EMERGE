# @package _global_
# StrongREJECT (313 forbidden prompts, MIT; fetched by
# scripts/fetch_strongreject_bank.py) crossed with the nudge bank -- the arm
# behind the paper's headline numbers (arXiv 2507.06253: insecure 11% -> 94%
# EM under the evil system prompt, -> 3% under HHH).  Same nudges, rubrics and
# generation settings as nudged_core, so nudge deltas are comparable across
# the two banks.  n_per_question is a budget choice (313 questions x 7 nudge
# conditions), not paper-pinned: the paper does not state its sampling count.
suites:
  - name: nudged_strongreject
    kind: nudged_freeform
    path: data/eval/free_form/strongreject.jsonl
    demo_path: plugins/prompt_sensitivity/data/nudges.jsonl
    rubrics: config/rubrics/broad_misalignment.yaml
    n_per_question: 10
    max_new_tokens: 600
    temperature: 1.0
    sample: null

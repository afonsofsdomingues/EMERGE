# @package _global_
# Persona-consistency PAPER-MATERIALS variant, pass 2 of 2: output
# recognition (arXiv 2604.28082).  Evaluate `suites=persona_battery_paper`
# for the same run_id first.
# The paper builds recognition items from the model's high-harm responses on
# its 350-question bank, with foils generated by an unfinetuned foil model.
# EMERGE's output_recognition kind takes foils from a frozen paired bank
# instead, and the paper's 350-question bank carries no paired answers -- so
# this pass keeps the paired stand-in bank and sources the run's own
# generations from persona_paired_freeform (defined in the paper battery for
# exactly this purpose).  A foil-model arm would need foils from a second
# run's generations, a capability the kind does not have; this substitution
# is the documented protocol difference of the recognition measure.
# include_datasets[0] is REPURPOSED for this kind: it names the source suite
# whose generations file is read, not a bank filter.  Pin the source step /
# position seed via plugins.persona_consistency.{source_step,position_seed}.
suites:
  - name: persona_output_recognition
    kind: output_recognition
    path: data/eval/ab_and_sequence/llm_lat_harmful.jsonl
    include_datasets: [persona_paired_freeform]
    n_per_question: 10
    sample: null
